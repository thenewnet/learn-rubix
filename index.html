<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Learn Rubix — Animated Cube Solver</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%2300a651'/%3E%3Crect x='14' y='14' width='22' height='22' rx='4' fill='%23fff'/%3E%3Crect x='39' y='14' width='22' height='22' rx='4' fill='%23ffd500'/%3E%3Crect x='64' y='14' width='22' height='22' rx='4' fill='%23d0202a'/%3E%3Crect x='14' y='39' width='22' height='22' rx='4' fill='%231f6fe0'/%3E%3Crect x='39' y='39' width='22' height='22' rx='4' fill='%23fff'/%3E%3Crect x='64' y='39' width='22' height='22' rx='4' fill='%23ff5a1f'/%3E%3Crect x='14' y='64' width='22' height='22' rx='4' fill='%23ffd500'/%3E%3Crect x='39' y='64' width='22' height='22' rx='4' fill='%23d0202a'/%3E%3Crect x='64' y='64' width='22' height='22' rx='4' fill='%23fff'/%3E%3C/svg%3E" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo" aria-hidden="true"></span>
      <div>
        <h1>Learn Rubix</h1>
        <p>Watch every turn — learn to solve the cube step by step.</p>
      </div>
    </div>
    <div class="size-picker">
      <label for="size">Cube</label>
      <select id="size" aria-label="Cube size">
        <option value="2">2 × 2</option>
        <option value="3" selected>3 × 3</option>
        <option value="4">4 × 4</option>
        <option value="5">5 × 5</option>
      </select>
    </div>
  </header>

  <main>
    <section class="stage-wrap">
      <div id="scene" class="scene" aria-label="3D cube. Drag to rotate."></div>
      <div class="stage-bar">
        <span class="drag-hint">Drag the cube to look around · press U R F D L B to turn a face</span>
        <button id="resetView" class="ghost small">Recenter</button>
      </div>
    </section>

    <aside class="panel">
      <div class="actions">
        <button id="scramble" class="btn primary">Scramble</button>
        <button id="solve" class="btn accent">Solve</button>
        <button id="reset" class="btn ghost">Reset</button>
      </div>
      <button id="scan" class="btn scan-btn">📷 Solve from a photo of your cube</button>

      <div class="card">
        <div class="card-head">
          <h2>Solution</h2>
          <span id="progress" class="progress-count">—</span>
        </div>
        <div id="phase" class="phase"></div>
        <div class="progressbar"><div id="bar"></div></div>

        <div class="playback">
          <button id="stepBack" class="round" title="Previous move" disabled>◀ Prev</button>
          <button id="play" class="round wide" disabled>► Play</button>
          <button id="stepFwd" class="round" title="Next move" disabled>Next ▶</button>
        </div>

        <div class="pace-row">
          <label for="pace">Pace</label>
          <select id="pace">
            <option value="manual">Manual (I press Next)</option>
            <option value="900">Auto · fast (0.9s)</option>
            <option value="1600" selected>Auto · 1.6s / move</option>
            <option value="2400">Auto · 2.4s / move</option>
            <option value="3200">Auto · 3.2s / move</option>
          </select>
        </div>

        <div id="moves" class="moves"></div>
      </div>

      <div class="card">
        <div class="card-head"><h2>Unfolded map</h2></div>
        <div id="net" class="net"></div>
      </div>

      <p id="status" class="status"></p>
    </aside>
  </main>

  <!-- Scan modal -->
  <div id="scanModal" class="modal hidden" role="dialog" aria-modal="true" aria-label="Scan your cube">
    <div class="modal-card">
      <div class="modal-head">
        <div>
          <h2>Enter your cube</h2>
          <p>Hold your cube in the standard orientation, paint each sticker, or snap a photo per face. Centres are fixed.</p>
        </div>
        <button id="scanClose" class="ghost small" aria-label="Close">✕</button>
      </div>

      <div class="palette" id="palette" aria-label="Colour palette"></div>

      <div id="scanNet" class="scan-net"></div>

      <p id="scanStatus" class="scan-status"></p>
      <div class="modal-actions">
        <button id="scanClear" class="btn ghost">Clear</button>
        <button id="scanSolve" class="btn accent">Build &amp; Solve</button>
      </div>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
